[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "callstack"
version = "0.3.1"
description = "A call stack for AI agents to run deeply nested workflows reliably."
requires-python = ">=3.10"
dependencies = [
    "pyyaml",
    "mcp",
]

# The importable runtime package `agent_callstack` lives under
# plugins/callstack/ (that directory is the plugin's CLAUDE_PLUGIN_ROOT — see
# .claude-plugin/plugin.json — so it cannot be relocated). Point setuptools at
# the real location instead of pretending there are no modules. `mcp_server.py`
# is a loose script the plugin loader runs by path (not imported), and
# resources/analysis/*.py are standalone subprocess scripts (no __init__.py),
# so neither is a package — `include` scopes discovery to agent_callstack only.
[tool.setuptools.packages.find]
where = ["plugins/callstack"]
include = ["agent_callstack*"]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
    "hypothesis",
    "pre-commit",
    # Pin to match .pre-commit-config.yaml rev so the gate is reproducible
    # across local and CI environments. Local ruff and the pre-commit hook
    # must stay in lockstep — older or newer versions disagree on
    # formatting decisions, which silently leaves files dirty in one env
    # but clean in the other. Bump both this pin and the hook rev together.
    "ruff==0.9.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Lets `pytest` run from a bare checkout without first installing the package.
# Equivalent to what `pip install -e .` writes to its .pth (plugins/callstack
# on sys.path), but available with zero install — which is the dominant
# workflow for this Claude Code plugin. Kept deliberately; see M1 in the
# run-tasks log for the editable-install alternative.
pythonpath = ["plugins/callstack"]

[tool.coverage.run]
branch = true
source = [
    "plugins/callstack/agent_callstack",
    "plugins/callstack/resources",
]

[tool.coverage.report]
fail_under = 92
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]

[tool.ruff]
target-version = "py312"
line-length = 120
# dev/ holds throwaway spike scripts, RFCs, and run-task logs — exploratory
# scratch, not shipped code. Exempt it from lint/format so spikes don't gate CI.
extend-exclude = ["dev"]

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.ruff.lint.isort]
# Keep `import a` and `import b as c` from the same module in one statement
# so a single trailing `# noqa` covers the whole block (the codebase has a few
# intentional late re-export blocks that mix plain and aliased names).
combine-as-imports = true

[tool.ruff.lint.per-file-ignores]
# __init__.py re-exports the package's public API (see __all__); the imports
# are unused locally by design, so F401 (unused-import) does not apply.
"__init__.py" = ["F401"]

[tool.ruff.format]
