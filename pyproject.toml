[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "callstack"
version = "0.1.1"
description = "A call stack for AI agents to run deeply nested workflows reliably."
requires-python = ">=3.10"
dependencies = [
    "pyyaml",
    "mcp",
]

# The runtime package lives under plugins/callstack and is consumed via
# pytest's pythonpath, not by being installed. Declare no importable modules
# so `pip install -e '.[dev]'` resolves the dev extras without setuptools
# attempting (and failing) package auto-discovery.
[tool.setuptools]
py-modules = []

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
    "hypothesis",
    "pre-commit",
    # Pin to match .pre-commit-config.yaml rev so the gate is reproducible
    # across local and CI environments. Local ruff and the pre-commit hook
    # must stay in lockstep — older or newer versions disagree on
    # formatting decisions, which silently leaves files dirty in one env
    # but clean in the other. Bump both this pin and the hook rev together.
    "ruff==0.9.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["plugins/callstack"]

[tool.coverage.run]
branch = true
source = [
    "plugins/callstack/agent_callstack",
    "plugins/callstack/resources",
]

[tool.coverage.report]
fail_under = 92
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.ruff.lint.isort]
# Keep `import a` and `import b as c` from the same module in one statement
# so a single trailing `# noqa` covers the whole block (the codebase has a few
# intentional late re-export blocks that mix plain and aliased names).
combine-as-imports = true

[tool.ruff.lint.per-file-ignores]
# __init__.py re-exports the package's public API (see __all__); the imports
# are unused locally by design, so F401 (unused-import) does not apply.
"__init__.py" = ["F401"]

[tool.ruff.format]
