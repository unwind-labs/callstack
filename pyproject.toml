[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "callstack"
version = "0.1.1"
description = "A call stack for AI agents to run deeply nested workflows reliably."
requires-python = ">=3.10"
dependencies = [
    "pyyaml",
    "mcp",
]

# The runtime package lives under plugins/callstack and is consumed via
# pytest's pythonpath, not by being installed. Declare no importable modules
# so `pip install -e '.[dev]'` resolves the dev extras without setuptools
# attempting (and failing) package auto-discovery.
[tool.setuptools]
py-modules = []

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
    "hypothesis",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["plugins/callstack"]

[tool.coverage.run]
branch = true
source = [
    "plugins/callstack/agent_callstack",
    "plugins/callstack/resources",
]

[tool.coverage.report]
fail_under = 92
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
